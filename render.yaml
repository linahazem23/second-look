services:
  - type: web
    name: second-look-api
    runtime: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_MERCHANT_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: 20.18.0
